[package]
name = "la_meuh"
version = "3.0.0"
edition = "2021"
authors = ["Spellskite-coding", "Marwane Toury"]
license = "MIT"
description = "La Meuh - Gestionnaire de mises a jour Windows (winget)"
publish = false

[[bin]]
name = "la_meuh"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_SystemServices",
    "Win32_System_IO",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
